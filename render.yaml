# TruthTrace — Render Blueprint
# Deploy both services with: connect this repo to Render → "New Blueprint"

services:
  # ── Backend: FastAPI + Gemini + FAISS ────────────────────────────────────────
  - type: web
    name: truthtrace-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -c "from fastembed import TextEmbedding; list(TextEmbedding('sentence-transformers/all-MiniLM-L6-v2').embed(['warmup']))"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DEBUG
        value: "False"
      - key: HOST
        value: "0.0.0.0"
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
      # ── Set these in Render Dashboard → Environment ──────────────────────────
      - key: GEMINI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: GOOGLE_FACT_CHECK_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # ── Frontend: React + Vite Static Site ───────────────────────────────────────
  - type: web
    name: truthtrace-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
